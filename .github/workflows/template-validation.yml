# Runs non-deployment template and PSRule checks without Azure sign-in.
# Full AI App Gallery deployment validation must run separately through an approved process.

name: Template Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  template_validation_job:
    runs-on: windows-latest
    name: non-deployment template validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare Python dependency constraints
        shell: pwsh
        run: |
          $constraintPath = Join-Path $env:RUNNER_TEMP "template-validation-constraints.txt"
          "azure-mgmt-resource<26" | Out-File -FilePath $constraintPath -Encoding utf8
          "PIP_CONSTRAINT=$constraintPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: microsoft/template-validation-action@bae4895d0a8abd4f0d5aad68ae8647b3027f4c91 # v0.4.4
        id: validation
        with:
          validateAzd: false
          useDevContainer: false
          validateTests: "None"
          securityAction: PSRule
          # Keep the static file checks without requiring the removed deployment workflow.
          validatePaths: "README.md,LICENSE.md,SECURITY.md,CODE_OF_CONDUCT.md,CONTRIBUTING.md,ISSUE_TEMPLATE.md,azure.yaml,infra,.devcontainer"
        env:
          PYTHONUTF8: "1"
          README_H2_TAG: "## Features,## Getting Started,## Guidance,## Resources"
          # This pinned action requires these non-secret IDs even with validateAzd: false.
          # They satisfy its precheck only; no Azure credential or OIDC permission is supplied.
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: print result
        shell: bash
        run: cat ${{ steps.validation.outputs.resultFile }}
